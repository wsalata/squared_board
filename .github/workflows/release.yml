name: Release

# Tag v* buduje podpisany AAB i APK, i podpina oba pod GitHub Release:
# AAB idzie do Google Play, APK do instalacji wprost z telefonu.
# Uruchomienie ręczne (workflow_dispatch) buduje to samo, ale zostawia
# pliki tylko jako artefakty przebiegu.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Pierwszy krok, przed checkoutem i Javą: wersja z tagu idzie wprost do versionName,
      # a zle oznaczonego pliku w Google Play nie da sie juz poprawic - tylko wydac nowy.
      # Czytanie samej zmiennej srodowiskowej nie wymaga repozytorium, wiec blad
      # zglasza sie w kilka sekund zamiast po calym buildzie.
      - name: Sprawdz format tagu
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' nie pasuje do v<major>.<minor>.<patch>, np. v1.1.0."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME ma poprawny format."

      - uses: actions/checkout@v4

      # 25 uruchamia demona Gradle (gradle-daemon-jvm.properties),
      # 17 jest toolchainem kompilacji — instalacja obu oszczędza pobieranie.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy jednostkowe
        run: ./gradlew testDebugUnitTest

      - name: Odszyfruj i zweryfikuj keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"

          bytes=$(stat -c%s "$ks")
          echo "Keystore po dekodowaniu: $bytes bajtow"
          echo "Pierwsze bajty: $(head -c 8 "$ks" | od -An -tx1 | tr -s ' ')"
          echo "Rozpoznany typ: $(file -b "$ks")"
          if [ "$bytes" -lt 1000 ]; then
            echo "::error::KEYSTORE_BASE64 daje plik $bytes bajtow - sekret jest pusty albo obciety."
            exit 1
          fi

          if ! keytool -list -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/aliases.txt" 2>&1; then
            echo "::error::Keystore nie daje sie otworzyc. Blad ASN.1 = uszkodzony KEYSTORE_BASE64; blad o hasle = zle KEYSTORE_PASSWORD."
            sed 's/^/    /' "$RUNNER_TEMP/aliases.txt"
            exit 1
          fi
          sed 's/^/    /' "$RUNNER_TEMP/aliases.txt"

          if ! grep -qi "^$KEY_ALIAS," "$RUNNER_TEMP/aliases.txt"; then
            echo "::error::W keystore nie ma aliasu '$KEY_ALIAS' (porownanie bez wielkosci liter)."
            exit 1
          fi
          echo "Keystore otwarty, alias '$KEY_ALIAS' znaleziony."

      # Tag jest jedynym zrodlem prawdy o wersji: bez tego nazwa pliku i versionName
      # w srodku moga sie rozjechac, bo nikt ich ze soba nie sprawdza.
      - name: Ustal versionName z tagu
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Zbuduj podpisany AAB i APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Zweryfikuj podpis
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_number }}
          retention-days: 90
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

      # Nazwy z wersja: pobrany "app-release.apk" nic nie mowi o tym, co zawiera.
      - name: Nazwij pliki wydania
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release/squared-board-$tag.aab"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/squared-board-$tag.apk"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/release/mapping-$tag.txt"
          ls -lh "$RUNNER_TEMP/release"

      - name: Podepnij pod GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/release/*.aab
            ${{ runner.temp }}/release/*.apk
            ${{ runner.temp }}/release/mapping-*.txt
